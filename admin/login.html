<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — Prophone Béziers</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1d0b0f">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preload" as="font" type="font/woff2" href="../assets/fonts/baloo2-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="../assets/fonts/inter-latin.woff2" crossorigin>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin login-page">
<main id="main" class="login-wrap">
  <div class="card login-card">
    <img src="../assets/favicon.svg" width="56" height="56" alt="" style="border-radius:14px">
    <h1>Espace propriétaire</h1>
    <p class="muted">Connectez-vous pour modifier vos tarifs.</p>
    <form id="login-form" novalidate class="stack">
      <div class="field"><label for="email">Adresse e-mail</label><input class="input input--lg" id="email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Mot de passe</label><input class="input input--lg" id="password" name="password" type="password" autocomplete="current-password" required></div>
      <p id="login-msg" class="msg msg--error" role="alert" hidden></p>
      <button class="btn btn--primary btn--lg" type="submit" style="width:100%">Se connecter</button>
    </form>
    <p style="margin-top:1.2rem"><a href="../index.html">← Retour au site</a></p>
  </div>
</main>
<script type="module" src="../js/admin/login.js"></script>
</body>
</html>
